<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to PPT Converter</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 PDF to PPT</h1>
            <p>Convert your PDF files to PowerPoint presentations</p>
        </header>
        
        <div class="upload-section">
            <div class="file-input-container">
                <input type="file" id="pdfFile" accept=".pdf" class="file-input">
                <label for="pdfFile" class="file-label">
                    <span class="upload-icon">📁</span>
                    <span class="upload-text">Choose PDF File</span>
                </label>
            </div>
            <div id="fileName" class="file-name"></div>
        </div>

        <div class="options-section">
            <h3>Conversion Options</h3>
            <div class="option">
                <label>
                    <input type="checkbox" id="includeImages" checked>
                    Include Images
                </label>
            </div>
            <div class="option">
                <label>
                    <input type="checkbox" id="preserveFormatting" checked>
                    Preserve Formatting
                </label>
            </div>
            <div class="option">
                <label for="slidesPerPage">Slides per PDF page:</label>
                <select id="slidesPerPage">
                    <option value="1">1 slide per page</option>
                    <option value="2">2 slides per page</option>
                    <option value="auto" selected>Auto detect</option>
                </select>
            </div>
        </div>

        <div class="action-section">
            <button id="convertBtn" class="convert-btn" disabled>
                <span class="btn-text">Convert to PPT</span>
                <span class="loading-spinner" style="display: none;">⏳</span>
            </button>
        </div>

        <div id="status" class="status"></div>
        
        <div id="downloadSection" class="download-section" style="display: none;">
            <button id="downloadBtn" class="download-btn">
                📥 Download PPT
            </button>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
